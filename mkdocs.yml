site_name: Extra CODEOWNERS
site_description: Delegate narrowly scoped CODEOWNERS approvals to trusted GitHub Apps.
site_url: https://extra-codeowners.readthedocs.io/
repo_url: https://github.com/stampbot/extra-codeowners
repo_name: stampbot/extra-codeowners
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Tutorial:
      - Run your first check: tutorials/development-installation.md
  - How-to guides:
      - Register a GitHub App: how-to/register-app.md
      - Configure policy: how-to/configure.md
      - Prepare repository rules: how-to/prepare-repository-rules.md
      - Preflight a disposable evaluation beta: how-to/preflight-evaluation-beta.md
      - Troubleshoot a check: how-to/troubleshoot-check.md
      - Deploy an alpha in shadow mode: how-to/deploy.md
      - Upgrade, back up, and restore: how-to/upgrade.md
      - Operate and recover: how-to/operate.md
  - Reference:
      - Project status: reference/project-status.md
      - Recipient notice bundles: reference/recipient-notices.md
      - Source archives: reference/source-archives.md
      - Wheel-native component catalogs: reference/native-components.md
      - Retained legacy images: reference/legacy-preview-inventory.md
      - Configuration: reference/configuration.md
      - Checks and evaluation: reference/checks.md
      - Command line: reference/cli.md
      - GitHub permissions and events: reference/github-permissions.md
      - HTTP API: reference/http-api.md
      - Evaluation beta preflight: reference/evaluation-beta-preflight.md
