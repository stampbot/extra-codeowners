name: Release

on:
  workflow_call:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/extra-codeowners
  UV_FROZEN: "true"

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      already_released: ${{ steps.existing.outputs.already_released }}
      prerelease: ${{ steps.release-kind.outputs.prerelease }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      python_version: ${{ steps.plan.outputs.python_version }}
      revision: ${{ steps.source.outputs.revision }}
      superseded: ${{ steps.plan.outputs.superseded }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    env:
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Check out release commit and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SOURCE_REVISION }}

      - name: Require a full main-branch commit
        id: source
        run: |
          set -euo pipefail
          revision="$(git rev-parse --verify 'HEAD^{commit}')"
          if [[ "${SOURCE_REVISION}" != "${revision}" ]]; then
            printf 'Requested revision %s resolved to %s.\n' "${SOURCE_REVISION}" "${revision}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${revision}" origin/main; then
            printf 'Release revision %s is not on main.\n' "${revision}" >&2
            exit 1
          fi
          printf 'revision=%s\n' "${revision}" >>"${GITHUB_OUTPUT}"

      - name: Calculate version from release history
        id: plan
        run: python .github/scripts/release_plan.py

      - name: Require a superseding release on main
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
          SUPERSEDED: ${{ steps.plan.outputs.superseded }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${SUPERSEDED}" != true ]]; then
            exit 0
          fi
          superseding_revision="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "${SOURCE_REVISION}" "${superseding_revision}"; then
            printf 'Superseding tag %s does not descend from source revision %s.\n' \
              "${TAG}" "${SOURCE_REVISION}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${superseding_revision}" origin/main; then
            printf 'Superseding tag %s at %s is not on main.\n' \
              "${TAG}" "${superseding_revision}" >&2
            exit 1
          fi

      - name: Require the previous release to be complete
        env:
          GH_TOKEN: ${{ github.token }}
          LEGACY_MUTABLE_BASELINE: v0.1.0-alpha.7
          PREVIOUS_TAG: ${{ steps.plan.outputs.previous_tag }}
        run: |
          set -euo pipefail
          if [[ -z "${PREVIOUS_TAG}" ]]; then
            exit 0
          fi
          lookup_release() {
            local attempt response result status
            for attempt in 1 2 3; do
              set +e
              response="$(
                gh api --include \
                  "repos/${GITHUB_REPOSITORY}/releases/tags/${PREVIOUS_TAG}" \
                  --jq '"draft=\(.draft);immutable=\(.immutable)"' 2>&1
              )"
              result=$?
              set -e
              status="$(
                sed -n 's#^HTTP/[^ ]* \([0-9][0-9][0-9]\).*#\1#p' <<<"${response}" |
                  tail -n 1
              )"
              if (( result == 0 )); then
                if [[ "${status}" != 200 ]]; then
                  printf 'Previous-release lookup succeeded with unexpected HTTP status %s.\n' \
                    "${status:-unknown}" >&2
                  return 1
                fi
                case "$(tail -n 1 <<<"${response}")" in
                  'draft=false;immutable=true') printf 'published\n' ;;
                  'draft=false;immutable=false') printf 'mutable\n' ;;
                  draft=true\;immutable=*) printf 'draft\n' ;;
                  *)
                    printf 'Previous-release lookup returned invalid release state.\n' >&2
                    return 1
                    ;;
                esac
                return 0
              fi
              if [[ "${status}" == 404 ]]; then
                printf 'missing\n'
                return 0
              fi
              printf 'Previous-release lookup attempt %d failed (HTTP %s).\n' \
                "${attempt}" "${status:-unavailable}" >&2
              if (( attempt < 3 )); then
                sleep "$((attempt * 5))"
              else
                printf '%s\n' "${response}" >&2
                return 1
              fi
            done
          }

          previous_state="$(lookup_release)"
          if [[ "${previous_state}" == mutable &&
            "${PREVIOUS_TAG}" == "${LEGACY_MUTABLE_BASELINE}" ]]; then
            printf 'Accepting legacy mutable baseline %s; all later releases must be immutable.\n' \
              "${PREVIOUS_TAG}" >&2
            exit 0
          fi
          if [[ "${previous_state}" != published ]]; then
            printf 'Previous tag %s has no completed immutable GitHub release (%s); repair it before advancing.\n' \
              "${PREVIOUS_TAG}" "${previous_state}" >&2
            exit 1
          fi

      - name: Classify release
        id: release-kind
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if [[ "${VERSION}" == *-* ]]; then
            printf 'prerelease=true\n' >>"${GITHUB_OUTPUT}"
          else
            printf 'prerelease=false\n' >>"${GITHUB_OUTPUT}"
          fi

      - name: Detect a completed release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          SUPERSEDED: ${{ steps.plan.outputs.superseded }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          lookup_release() {
            local attempt response result status
            for attempt in 1 2 3; do
              set +e
              response="$(
                gh api --include \
                  "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
                  --jq '"draft=\(.draft);immutable=\(.immutable)"' 2>&1
              )"
              result=$?
              set -e
              status="$(
                sed -n 's#^HTTP/[^ ]* \([0-9][0-9][0-9]\).*#\1#p' <<<"${response}" |
                  tail -n 1
              )"
              if (( result == 0 )); then
                if [[ "${status}" != 200 ]]; then
                  printf 'Release lookup succeeded with unexpected HTTP status %s.\n' \
                    "${status:-unknown}" >&2
                  return 1
                fi
                case "$(tail -n 1 <<<"${response}")" in
                  'draft=false;immutable=true') printf 'published\n' ;;
                  'draft=false;immutable=false') printf 'mutable\n' ;;
                  draft=true\;immutable=*) printf 'draft\n' ;;
                  *)
                    printf 'Release lookup returned invalid release state.\n' >&2
                    return 1
                    ;;
                esac
                return 0
              fi
              if [[ "${status}" == 404 ]]; then
                printf 'missing\n'
                return 0
              fi
              printf 'Release lookup attempt %d failed (HTTP %s).\n' \
                "${attempt}" "${status:-unavailable}" >&2
              if (( attempt < 3 )); then
                sleep "$((attempt * 5))"
              else
                printf '%s\n' "${response}" >&2
                return 1
              fi
            done
          }

          release_state="$(lookup_release)"
          case "${release_state}" in
            published) printf 'already_released=true\n' >>"${GITHUB_OUTPUT}" ;;
            draft|missing)
              if [[ "${SUPERSEDED}" == true ]]; then
                printf 'A descendant run allocated %s but did not complete its immutable release.\n' \
                  "${TAG}" >&2
                printf 'Rerun that newer workflow before retrying this superseded run.\n' >&2
                exit 1
              fi
              printf 'already_released=false\n' >>"${GITHUB_OUTPUT}"
              ;;
            mutable)
              printf 'Release %s is published but mutable; repair it before retrying.\n' "${TAG}" >&2
              exit 1
              ;;
            *)
              printf 'Unknown release state %s.\n' "${release_state}" >&2
              exit 1
              ;;
          esac

  package:
    name: Build Python distributions
    needs: plan
    if: needs.plan.outputs.already_released != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.revision }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@6ee6290f1cbc4156c0bdd66691b2c144ef8df19a # v7.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked build backend
        run: uv sync --frozen --only-group build --no-install-project --no-build

      - name: Build release distributions
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.plan.outputs.python_version }}
        run: uv build --python .venv/bin/python --no-build-isolation --out-dir dist

      - name: Verify release version
        env:
          EXPECTED_VERSION: ${{ needs.plan.outputs.python_version }}
        run: |
          python - <<'PY'
          import email.parser
          import os
          import zipfile
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit("release build must produce one wheel and one source distribution")
          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_name = next(name for name in archive.namelist() if name.endswith("/METADATA"))
              metadata = email.parser.BytesParser().parsebytes(archive.read(metadata_name))
          if metadata["Version"] != os.environ["EXPECTED_VERSION"]:
              raise SystemExit(
                  f"wheel version {metadata['Version']} does not match {os.environ['EXPECTED_VERSION']}"
              )
          PY

      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-python-${{ needs.plan.outputs.revision }}
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  chart:
    name: Build Helm chart
    needs: plan
    if: needs.plan.outputs.already_released != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.revision }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0 # helm runtime

      - name: Package and verify chart
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          helm lint charts/extra-codeowners
          helm package charts/extra-codeowners \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination dist
          chart="dist/extra-codeowners-${VERSION}.tgz"
          test -f "${chart}"
          helm template extra-codeowners "${chart}" |
            grep -F "image: \"ghcr.io/stampbot/extra-codeowners:${VERSION}\""

      - name: Upload Helm chart
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-chart-${{ needs.plan.outputs.revision }}
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  image:
    name: Build image (${{ matrix.architecture }})
    needs: plan
    if: needs.plan.outputs.already_released != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            machine: x86_64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            machine: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Require native runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "${EXPECTED_MACHINE}"

      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.revision }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          buildkitd-flags: --debug
          cache-binary: false
          driver-opts: >-
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          version: v0.36.1 # buildx runtime

      - name: Build and push native image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: >-
            generator=docker/buildkit-syft-scanner:1.11.0@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68
          tags: ${{ env.IMAGE }}
          outputs: type=image,name=${{ env.IMAGE }},oci-artifact=true,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            SOURCE_REVISION=${{ needs.plan.outputs.revision }}
            VERSION=${{ needs.plan.outputs.version }}
          cache-from: type=gha,scope=container-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.architecture }},ignore-error=true,timeout=5m

      - name: Record native OCI digests
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Build returned invalid digest %s.\n' "${DIGEST}" >&2
            exit 1
          fi
          for attempt in 1 2 3; do
            if docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" \
              >native-index.json; then
              break
            fi
            printf 'Native index lookup attempt %d failed.\n' "${attempt}" >&2
            if (( attempt < 3 )); then
              sleep "$((attempt * 5))"
            else
              exit 1
            fi
          done
          platform_digest="$(
            jq -er --arg architecture "${ARCHITECTURE}" \
              '[.manifests[] | select(
                .platform.os == "linux" and .platform.architecture == $architecture
              ) | .digest] | if length == 1 then .[0] else error(
                "expected exactly one manifest for " + $architecture
              ) end' native-index.json
          )"
          if ! [[ "${platform_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Build returned invalid %s platform digest %s.\n' \
              "${ARCHITECTURE}" "${platform_digest}" >&2
            exit 1
          fi
          printf '%s\n' "${DIGEST}" >"build-index-${ARCHITECTURE}.txt"
          printf '%s\n' "${platform_digest}" >"digest-${ARCHITECTURE}.txt"

      - name: Collect raw native filesystem inventory
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          CONTAINER_NAME: extra-codeowners-release-inventory-${{ matrix.architecture }}
        run: |
          set -euo pipefail
          platform_digest="$(<"digest-${ARCHITECTURE}.txt")"
          created=false
          cleanup() {
            if [[ "${created}" == true ]]; then
              docker container rm "${CONTAINER_NAME}" >/dev/null
            fi
          }
          trap cleanup EXIT
          # create/export reads the exact filesystem without starting its workload.
          docker create --name "${CONTAINER_NAME}" "${IMAGE}@${platform_digest}" >/dev/null
          created=true
          docker export "${CONTAINER_NAME}" |
            python -I -S -B tools/release_inventory.py \
              --architecture "${ARCHITECTURE}" \
              --platform-digest "${platform_digest}" \
              --rootfs-tar - \
              --output "distribution-inventory-${ARCHITECTURE}.json"

      - name: Pull exact native image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for attempt in 1 2 3; do
            if docker pull "${IMAGE}@${DIGEST}"; then
              exit 0
            fi
            printf 'Native image pull attempt %d failed.\n' "${attempt}" >&2
            if (( attempt < 3 )); then
              sleep "$((attempt * 5))"
            fi
          done
          exit 1

      - name: Smoke test exact native image
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          CONTAINER_NAME: extra-codeowners-release-smoke-${{ matrix.architecture }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PYTHON_VERSION: ${{ needs.plan.outputs.python_version }}
          REVISION: ${{ needs.plan.outputs.revision }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          .github/scripts/smoke-container.sh \
            "${IMAGE}@${DIGEST}" \
            "${ARCHITECTURE}" \
            "${CONTAINER_NAME}" \
            "${VERSION}" \
            "${PYTHON_VERSION}" \
            "${REVISION}"

      - name: Inventory high-severity vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          by-cve: true
          config: .grype.yaml
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          fail-build: false
          only-fixed: false
          output-file: vulnerability-report-${{ matrix.architecture }}.json
          output-format: json
          severity-cutoff: high

      - name: Reject fixable high-severity vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          by-cve: true
          config: .grype.yaml
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          fail-build: true
          only-fixed: true
          output-format: table
          severity-cutoff: high

      - name: Upload native release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-${{ matrix.architecture }}-${{ needs.plan.outputs.revision }}
          path: |
            build-index-${{ matrix.architecture }}.txt
            digest-${{ matrix.architecture }}.txt
            distribution-inventory-${{ matrix.architecture }}.json
            vulnerability-report-${{ matrix.architecture }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish:
    name: Publish release
    needs:
      - plan
      - package
      - chart
      - image
    if: needs.plan.outputs.already_released != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out release commit and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.plan.outputs.revision }}

      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-python-${{ needs.plan.outputs.revision }}
          path: release/python

      - name: Download Helm chart
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-chart-${{ needs.plan.outputs.revision }}
          path: release/chart

      - name: Download amd64 image evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-image-amd64-${{ needs.plan.outputs.revision }}
          path: release/image/amd64

      - name: Download arm64 image evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-image-arm64-${{ needs.plan.outputs.revision }}
          path: release/image/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          buildkitd-flags: --debug
          cache-binary: false
          driver-opts: >-
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          version: v0.36.1 # buildx runtime

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0 # helm runtime

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Create immutable Git tag
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.plan.outputs.revision }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            if [[ "$(git cat-file -t "refs/tags/${TAG}")" != tag ]]; then
              printf 'Existing release ref %s is not an annotated tag.\n' "${TAG}" >&2
              exit 1
            fi
            existing="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
            if [[ "${existing}" != "${REVISION}" ]]; then
              printf 'Tag %s already points to %s, not %s.\n' "${TAG}" "${existing}" "${REVISION}" >&2
              exit 1
            fi
            exit 0
          fi
          tag_object="$(
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f tag="${TAG}" \
              -f message="Release ${TAG}" \
              -f object="${REVISION}" \
              -f type=commit \
              -f 'tagger[name]=github-actions[bot]' \
              -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com' \
              --jq .sha
          )"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${tag_object}" >/dev/null

      - name: Publish or verify multiarch image
        id: image
        env:
          REVISION: ${{ needs.plan.outputs.revision }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          reference="${IMAGE}:${VERSION}"
          amd64_build_index="$(<release/image/amd64/build-index-amd64.txt)"
          arm64_build_index="$(<release/image/arm64/build-index-arm64.txt)"
          amd64_digest="$(<release/image/amd64/digest-amd64.txt)"
          arm64_digest="$(<release/image/arm64/digest-arm64.txt)"
          for digest in \
            "${amd64_build_index}" \
            "${arm64_build_index}" \
            "${amd64_digest}" \
            "${arm64_digest}"; do
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          done

          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              printf 'Command attempt %d failed.\n' "${attempt}" >&2
              if (( attempt < 3 )); then
                sleep "$((attempt * 5))"
              else
                return 1
              fi
            done
          }
          probe_image() {
            local attempt output
            for attempt in 1 2 3; do
              if output="$(docker buildx imagetools inspect --raw "${reference}" 2>&1)"; then
                printf '%s\n' "${output}" >/tmp/published-image.json
                return 0
              fi
              if grep -Fxq "ERROR: ${reference}: not found" <<<"${output}"; then
                return 44
              fi
              printf 'Image lookup attempt %d failed.\n' "${attempt}" >&2
              if (( attempt < 3 )); then
                sleep "$((attempt * 5))"
              else
                printf '%s\n' "${output}" >&2
                return 1
              fi
            done
          }

          if probe_image; then
            :
          else
            probe_status=$?
            if (( probe_status != 44 )); then
              exit "${probe_status}"
            fi
            retry docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --annotation "index:org.opencontainers.image.revision=${REVISION}" \
              --annotation "index:org.opencontainers.image.version=${VERSION}" \
              --tag "${reference}" \
              "${IMAGE}@${amd64_build_index}" \
              "${IMAGE}@${arm64_build_index}"
          fi

          retry docker buildx imagetools inspect "${reference}" >/tmp/published-image.txt
          digest="$(awk '$1 == "Digest:" {print $2; exit}' /tmp/published-image.txt)"
          if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Could not resolve published image digest.\n' >&2
            exit 1
          fi
          retry docker buildx imagetools inspect --raw "${IMAGE}@${digest}" \
            >/tmp/published-image.json
          raw="$(</tmp/published-image.json)"
          platforms="$(
            jq -r '.manifests[]? | select(.platform.os == "linux") |
              "\(.platform.os)/\(.platform.architecture)"' <<<"${raw}" | sort -u
          )"
          if [[ "${platforms}" != $'linux/amd64\nlinux/arm64' ]]; then
            printf 'Unexpected published platforms:\n%s\n' "${platforms}" >&2
            exit 1
          fi
          for architecture in amd64 arm64; do
            case "${architecture}" in
              amd64) expected_digest="${amd64_digest}" ;;
              arm64) expected_digest="${arm64_digest}" ;;
            esac
            published_digest="$(
              jq -er --arg architecture "${architecture}" \
                '[.manifests[] | select(
                  .platform.os == "linux" and .platform.architecture == $architecture
                ) | .digest] | if length == 1 then .[0] else error(
                  "expected exactly one manifest for " + $architecture
                ) end' /tmp/published-image.json
            )"
            if [[ "${published_digest}" != "${expected_digest}" ]]; then
              printf "%s contains %s digest %s, not this run's %s.\n" \
                "${reference}" "${architecture}" "${published_digest}" "${expected_digest}" >&2
              printf 'Rerun failed jobs from the original workflow run to reuse its artifacts.\n' >&2
              exit 1
            fi
          done

          retry docker pull --platform linux/amd64 "${IMAGE}@${digest}"
          published_revision="$(
            docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "${IMAGE}@${digest}"
          )"
          published_version="$(
            docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
              "${IMAGE}@${digest}"
          )"
          if [[ "${published_revision}" != "${REVISION}" ]]; then
            printf '%s resolves to revision %s, not %s.\n' \
              "${reference}" "${published_revision}" "${REVISION}" >&2
            exit 1
          fi
          if [[ "${published_version}" != "${VERSION}" ]]; then
            printf '%s resolves to version %s, not %s.\n' \
              "${reference}" "${published_version}" "${VERSION}" >&2
            exit 1
          fi
          printf 'digest=%s\n' "${digest}" >>"${GITHUB_OUTPUT}"
          printf '%s@%s\n' "${IMAGE}" "${digest}" >release/image/image-reference.txt

      - name: Attest multiarch image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Sign multiarch image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest Python distributions
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/python/*

      - name: Attest Helm chart
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/chart/*.tgz

      - name: Attest raw container distribution inventories
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/image/*/distribution-inventory-*.json

      - name: Sign release files
        run: |
          set -euo pipefail
          while IFS= read -r -d '' artifact; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "${artifact}"
          done < <(find release/python release/chart release/image -type f \
            \( -name '*.whl' -o -name '*.tar.gz' -o -name '*.tgz' \
            -o -name 'distribution-inventory-*.json' \) -print0)

      - name: Publish or verify Helm chart
        id: chart
        env:
          ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          chart="release/chart/extra-codeowners-${VERSION}.tgz"
          registry="oci://ghcr.io/${{ github.repository_owner }}/charts"
          reference="${registry}/extra-codeowners"
          plain_reference="ghcr.io/${{ github.repository_owner }}/charts/extra-codeowners"
          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              printf 'Command attempt %d failed.\n' "${attempt}" >&2
              if (( attempt < 3 )); then
                sleep "$((attempt * 5))"
              else
                return 1
              fi
            done
          }
          registry_login() {
            printf '%s\n' "${GHCR_TOKEN}" |
              helm registry login ghcr.io --username "${ACTOR}" --password-stdin
          }
          download_chart() {
            rm -f "/tmp/published-chart-artifact/extra-codeowners-${VERSION}.tgz"
            helm pull "${reference}" --version "${VERSION}" \
              --destination /tmp/published-chart-artifact
          }
          probe_chart() {
            local attempt missing_is_absent output
            missing_is_absent="$1"
            for attempt in 1 2 3; do
              if output="$(helm show chart "${reference}" --version "${VERSION}" 2>&1)"; then
                printf '%s\n' "${output}" >/tmp/published-chart
                return 0
              fi
              if [[ "${missing_is_absent}" == true ]] &&
                grep -Fq "${plain_reference}:${VERSION}: not found" <<<"${output}"; then
                return 44
              fi
              printf 'Chart lookup attempt %d failed.\n' "${attempt}" >&2
              if (( attempt < 3 )); then
                sleep "$((attempt * 5))"
              else
                printf '%s\n' "${output}" >&2
                return 1
              fi
            done
          }

          retry registry_login
          if probe_chart true; then
            :
          else
            probe_status=$?
            if (( probe_status != 44 )); then
              exit "${probe_status}"
            fi
            retry helm push "${chart}" "${registry}"
          fi
          probe_chart false
          grep -Fxq "version: ${VERSION}" /tmp/published-chart
          grep -Fxq "appVersion: ${VERSION}" /tmp/published-chart
          mkdir -p /tmp/published-chart-artifact
          retry download_chart
          if ! cmp --silent \
            "${chart}" \
            "/tmp/published-chart-artifact/extra-codeowners-${VERSION}.tgz"; then
            printf "%s does not contain this run's chart artifact.\n" \
              "${plain_reference}:${VERSION}" >&2
            printf 'Rerun failed jobs from the original workflow run to reuse its artifacts.\n' >&2
            exit 1
          fi
          retry docker buildx imagetools inspect "${plain_reference}:${VERSION}" \
            --format '{{json .Manifest}}' >/tmp/chart-manifest.json
          chart_digest="$(jq -er .digest /tmp/chart-manifest.json)"
          if ! [[ "${chart_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Could not resolve the published chart digest.\n' >&2
            exit 1
          fi
          printf 'digest=%s\n' "${chart_digest}" >>"${GITHUB_OUTPUT}"
          printf '%s@%s\n' "${plain_reference}" "${chart_digest}" \
            >release/chart/chart-reference.txt
          retry cosign sign --yes "${plain_reference}@${chart_digest}"

      - name: Create GitHub release
        env:
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
          CHART_REFERENCE: ghcr.io/${{ github.repository_owner }}/charts/extra-codeowners
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
          PYTHON_VERSION: ${{ needs.plan.outputs.python_version }}
          REVISION: ${{ needs.plan.outputs.revision }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -d '' artifacts < <(find release -type f -print0 | sort -z)
          if (( ${#artifacts[@]} == 0 )); then
            printf 'No release artifacts were assembled.\n' >&2
            exit 1
          fi
          python - "${artifacts[@]}" <<'PY'
          import collections
          import json
          import sys
          from pathlib import Path

          artifacts = [Path(argument) for argument in sys.argv[1:]]
          names = collections.Counter(path.name for path in artifacts)
          duplicates = sorted(name for name, count in names.items() if count != 1)
          if duplicates:
              raise SystemExit(f"release artifacts have duplicate names: {duplicates}")
          for artifact in artifacts:
              if not artifact.is_file() or artifact.stat().st_size == 0:
                  raise SystemExit(f"release artifact is missing or empty: {artifact}")
              if artifact.name.endswith(".sigstore.json"):
                  bundle = json.loads(artifact.read_text(encoding="utf-8"))
                  if not isinstance(bundle, dict):
                      raise SystemExit(f"Sigstore bundle is not a JSON object: {artifact}")
          PY
          arguments=(--generate-notes --verify-tag)
          if [[ "${PRERELEASE}" == true ]]; then
            arguments+=(--prerelease)
          fi
          if [[ -n "${PREVIOUS_TAG}" ]]; then
            arguments+=(--notes-start-tag "${PREVIOUS_TAG}")
          fi

          lookup_release() {
            local attempt response result status
            for attempt in 1 2 3; do
              set +e
              response="$(
                gh api --include \
                  "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
                  --jq '"draft=\(.draft);immutable=\(.immutable)"' 2>&1
              )"
              result=$?
              set -e
              status="$(
                sed -n 's#^HTTP/[^ ]* \([0-9][0-9][0-9]\).*#\1#p' <<<"${response}" |
                  tail -n 1
              )"
              if (( result == 0 )); then
                if [[ "${status}" != 200 ]]; then
                  printf 'Release lookup succeeded with unexpected HTTP status %s.\n' \
                    "${status:-unknown}" >&2
                  return 1
                fi
                case "$(tail -n 1 <<<"${response}")" in
                  'draft=false;immutable=true') printf 'published\n' ;;
                  'draft=false;immutable=false') printf 'mutable\n' ;;
                  draft=true\;immutable=*) printf 'draft\n' ;;
                  *)
                    printf 'Release lookup returned invalid release state.\n' >&2
                    return 1
                    ;;
                esac
                return 0
              fi
              if [[ "${status}" == 404 ]]; then
                printf 'missing\n'
                return 0
              fi
              printf 'Release lookup attempt %d failed (HTTP %s).\n' \
                "${attempt}" "${status:-unavailable}" >&2
              if (( attempt < 3 )); then
                sleep "$((attempt * 5))"
              else
                printf '%s\n' "${response}" >&2
                return 1
              fi
            done
          }

          verify_published_release() {
            local attempt
            for attempt in 1 2 3; do
              if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
                >/tmp/published-release.json; then
                if jq -e \
                  --arg tag "${TAG}" \
                  --argjson prerelease "${PRERELEASE}" \
                  '.tag_name == $tag and
                    .draft == false and
                    .immutable == true and
                    .prerelease == $prerelease and
                    (.assets | type == "array") and
                    ([.assets[].name] | length == (unique | length)) and
                    all(.assets[];
                      (.size | type == "number") and .size > 0 and
                      (.digest | type == "string") and
                      (.digest | test("^sha256:[0-9a-f]{64}$")))' \
                  /tmp/published-release.json >/dev/null; then
                  break
                fi
                printf 'Release postcondition attempt %d is incomplete or inconsistent.\n' \
                  "${attempt}" >&2
              else
                printf 'Published-release lookup attempt %d failed.\n' "${attempt}" >&2
              fi
              if (( attempt < 3 )); then
                sleep "$((attempt * 5))"
              else
                return 1
              fi
            done

            download_published_assets() {
              rm -rf /tmp/published-release-assets
              mkdir -p /tmp/published-release-assets
              gh release download "${TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                --dir /tmp/published-release-assets \
                --clobber
            }
            for attempt in 1 2 3; do
              if download_published_assets; then
                break
              fi
              printf 'Release asset download attempt %d failed.\n' "${attempt}" >&2
              if (( attempt < 3 )); then
                sleep "$((attempt * 5))"
              else
                return 1
              fi
            done

            python - <<'PY'
          import collections
          import hashlib
          import json
          from pathlib import Path

          local_root = Path("release")
          remote_root = Path("/tmp/published-release-assets")
          release = json.loads(Path("/tmp/published-release.json").read_text(encoding="utf-8"))
          local_files = [path for path in local_root.rglob("*") if path.is_file()]
          remote_files = [path for path in remote_root.rglob("*") if path.is_file()]
          if not local_files:
              raise SystemExit("the current run has no release assets")

          def unique_by_name(paths: list[Path], source: str) -> dict[str, Path]:
              counts = collections.Counter(path.name for path in paths)
              duplicates = sorted(name for name, count in counts.items() if count != 1)
              if duplicates:
                  raise SystemExit(f"{source} has duplicate asset names: {duplicates}")
              return {path.name: path for path in paths}

          local = unique_by_name(local_files, "the current run")
          remote = unique_by_name(remote_files, "the published release")
          api_assets = release["assets"]
          api_names = [asset["name"] for asset in api_assets]
          if len(api_names) != len(set(api_names)):
              raise SystemExit("the published release API has duplicate asset names")
          expected_names = collections.Counter(local.keys())
          if collections.Counter(api_names) != expected_names:
              raise SystemExit("the published release API asset names do not match this run")
          if collections.Counter(remote.keys()) != expected_names:
              raise SystemExit("the downloaded release asset names do not match this run")

          for asset in api_assets:
              name = asset["name"]
              published = remote[name]
              if published.stat().st_size != asset["size"]:
                  raise SystemExit(f"published release asset {name} has the wrong size")
              digest = "sha256:" + hashlib.sha256(published.read_bytes()).hexdigest()
              if digest != asset["digest"]:
                  raise SystemExit(f"published release asset {name} has the wrong digest")
              if name.endswith(".sigstore.json"):
                  json.loads(published.read_text(encoding="utf-8"))
              elif published.read_bytes() != local[name].read_bytes():
                  raise SystemExit(f"published release asset {name} does not match this run")
          PY
          .github/scripts/verify-release-provenance.sh \
            /tmp/published-release-assets \
            "${IMAGE}" \
            "${IMAGE_DIGEST}" \
            "${CHART_REFERENCE}" \
            "${CHART_DIGEST}" \
            "${PYTHON_VERSION}" \
            "${VERSION}" \
            "${REVISION}"
          }

          release_state="$(lookup_release)"
          case "${release_state}" in
            draft) gh release delete "${TAG}" --yes ;;
            missing) ;;
            published)
              verify_published_release
              exit 0
              ;;
            mutable)
              printf 'Release %s was published without immutability; repair it before retrying.\n' \
                "${TAG}" >&2
              exit 1
              ;;
            *)
              printf 'Unknown release state %s.\n' "${release_state}" >&2
              exit 1
              ;;
          esac
          gh release create "${TAG}" --draft "${arguments[@]}"
          gh release upload "${TAG}" "${artifacts[@]}"
          gh release edit "${TAG}" --draft=false
          verify_published_release

  verify-existing:
    name: Verify completed release
    needs: plan
    if: >-
      needs.plan.outputs.already_released == 'true' &&
      needs.plan.outputs.superseded != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Check out release commit and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.plan.outputs.revision }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          buildkitd-flags: --debug
          cache-binary: false
          driver-opts: >-
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          version: v0.36.1 # buildx runtime

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0 # helm runtime

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Verify published release surfaces
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          PYTHON_VERSION: ${{ needs.plan.outputs.python_version }}
          REVISION: ${{ needs.plan.outputs.revision }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              printf 'Command attempt %d failed.\n' "${attempt}" >&2
              if (( attempt < 3 )); then
                sleep "$((attempt * 5))"
              else
                return 1
              fi
            done
          }

          test "$(git cat-file -t "refs/tags/${TAG}")" = tag
          test "$(git rev-parse --verify "refs/tags/${TAG}^{commit}")" = "${REVISION}"
          retry gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            >/tmp/release.json
          jq -e --argjson prerelease "${PRERELEASE}" \
            '.draft == false and .immutable == true and .prerelease == $prerelease' \
            /tmp/release.json >/dev/null

          mkdir release-assets
          retry gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --dir release-assets --clobber
          required_assets=(
            "extra_codeowners-${PYTHON_VERSION}-py3-none-any.whl"
            "extra_codeowners-${PYTHON_VERSION}-py3-none-any.whl.sigstore.json"
            "extra_codeowners-${PYTHON_VERSION}.tar.gz"
            "extra_codeowners-${PYTHON_VERSION}.tar.gz.sigstore.json"
            "extra-codeowners-${VERSION}.tgz"
            "extra-codeowners-${VERSION}.tgz.sigstore.json"
            chart-reference.txt
            build-index-amd64.txt
            build-index-arm64.txt
            digest-amd64.txt
            digest-arm64.txt
            image-reference.txt
            distribution-inventory-amd64.json
            distribution-inventory-amd64.json.sigstore.json
            distribution-inventory-arm64.json
            distribution-inventory-arm64.json.sigstore.json
            vulnerability-report-amd64.json
            vulnerability-report-arm64.json
          )
          for asset in "${required_assets[@]}"; do
            test -f "release-assets/${asset}"
          done

          retry docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/tmp/image-manifest
          manifest="$(</tmp/image-manifest)"
          grep -Fq 'linux/amd64' <<<"${manifest}"
          grep -Fq 'linux/arm64' <<<"${manifest}"
          image_digest="$(awk '$1 == "Digest:" {print $2; exit}' /tmp/image-manifest)"
          if ! [[ "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Could not resolve the published image digest.\n' >&2
            exit 1
          fi
          test "$(<release-assets/image-reference.txt)" = "${IMAGE}@${image_digest}"
          retry docker buildx imagetools inspect --raw "${IMAGE}@${image_digest}" \
            >/tmp/image-manifest.json
          for architecture in amd64 arm64; do
            released_digest="$(<"release-assets/digest-${architecture}.txt")"
            published_digest="$(
              jq -er --arg architecture "${architecture}" \
                '[.manifests[] | select(
                  .platform.os == "linux" and .platform.architecture == $architecture
                ) | .digest] | if length == 1 then .[0] else error(
                  "expected exactly one manifest for " + $architecture
                ) end' /tmp/image-manifest.json
            )"
            test "${published_digest}" = "${released_digest}"
          done

          retry helm show chart \
            "oci://ghcr.io/${{ github.repository_owner }}/charts/extra-codeowners" \
            --version "${VERSION}" >/tmp/published-chart
          grep -Fxq "version: ${VERSION}" /tmp/published-chart
          grep -Fxq "appVersion: ${VERSION}" /tmp/published-chart
          chart_reference="ghcr.io/${{ github.repository_owner }}/charts/extra-codeowners"
          retry docker buildx imagetools inspect "${chart_reference}:${VERSION}" \
            --format '{{json .Manifest}}' >/tmp/chart-manifest.json
          chart_digest="$(jq -er .digest /tmp/chart-manifest.json)"
          if ! [[ "${chart_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Could not resolve the published chart digest.\n' >&2
            exit 1
          fi
          test "$(<release-assets/chart-reference.txt)" = \
            "${chart_reference}@${chart_digest}"
          mkdir -p /tmp/published-chart-artifact
          retry helm pull "oci://${chart_reference}" --version "${VERSION}" \
            --destination /tmp/published-chart-artifact
          cmp --silent \
            "release-assets/extra-codeowners-${VERSION}.tgz" \
            "/tmp/published-chart-artifact/extra-codeowners-${VERSION}.tgz"
          .github/scripts/verify-release-provenance.sh \
            release-assets \
            "${IMAGE}" \
            "${image_digest}" \
            "${chart_reference}" \
            "${chart_digest}" \
            "${PYTHON_VERSION}" \
            "${VERSION}" \
            "${REVISION}"

  complete:
    name: Release complete
    if: ${{ always() && needs.plan.result == 'success' }}
    needs:
      - plan
      - package
      - chart
      - image
      - publish
      - verify-existing
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require new or previously completed release
        env:
          ALREADY_RELEASED: ${{ needs.plan.outputs.already_released }}
          CHART_RESULT: ${{ needs.chart.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          SUPERSEDED: ${{ needs.plan.outputs.superseded }}
          VERIFY_RESULT: ${{ needs.verify-existing.result }}
        run: |
          if [[ "${SUPERSEDED}" == true ]]; then
            test "${ALREADY_RELEASED}" = true
            test "${PACKAGE_RESULT}" = skipped
            test "${CHART_RESULT}" = skipped
            test "${IMAGE_RESULT}" = skipped
            test "${PUBLISH_RESULT}" = skipped
            test "${VERIFY_RESULT}" = skipped
          elif [[ "${ALREADY_RELEASED}" == true ]]; then
            test "${PACKAGE_RESULT}" = skipped
            test "${CHART_RESULT}" = skipped
            test "${IMAGE_RESULT}" = skipped
            test "${PUBLISH_RESULT}" = skipped
            test "${VERIFY_RESULT}" = success
          else
            test "${PACKAGE_RESULT}" = success
            test "${CHART_RESULT}" = success
            test "${IMAGE_RESULT}" = success
            test "${PUBLISH_RESULT}" = success
            test "${VERIFY_RESULT}" = skipped
          fi
