name: Native wheelhouse

on:
  pull_request:
    paths:
      - .dockerignore
      - .github/scripts/native_wheelhouse.py
      - .github/workflows/native-wheelhouse.yml
      - containers/native-wheelhouse/**
      - tests/test_native_wheelhouse.py
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - .github/scripts/native_wheelhouse.py
      - .github/workflows/native-wheelhouse.yml
      - containers/native-wheelhouse/**
      - tests/test_native_wheelhouse.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-wheelhouse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}-native-wheelhouse

jobs:
  build:
    name: Build wheelhouse (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            machine: x86_64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            machine: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Require the native runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          if [ "$actual" != "$EXPECTED_MACHINE" ]; then
            echo "::error::Native wheelhouse runner is $actual, expected $EXPECTED_MACHINE"
            exit 1
          fi

      - name: Set up exact wheelhouse-verification Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.6"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cache-binary: false
          version: v0.35.0
          driver-opts: >-
            image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f

      - name: Build two isolated wheel sets
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: containers/native-wheelhouse/Dockerfile
          target: wheelhouse
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=local,dest=${{ runner.temp }}/native-wheelhouse
          provenance: false
          sbom: false
          cache-from: type=gha,scope=native-wheelhouse-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=native-wheelhouse-${{ matrix.architecture }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}

      - name: Verify the exported wheelhouse read-only contract
        env:
          PLATFORM: ${{ matrix.platform }}
        run: >-
          python .github/scripts/native_wheelhouse.py verify
          --inputs containers/native-wheelhouse/inputs.json
          --wheelhouse "$RUNNER_TEMP/native-wheelhouse/wheelhouse"
          --platform "$PLATFORM"
          --work "$RUNNER_TEMP/native-wheelhouse-verify"

      - name: Upload the verified platform wheelhouse
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: >-
            native-wheelhouse-${{ github.sha }}-${{ matrix.architecture }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-wheelhouse/wheelhouse/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    name: Publish verified multi-platform wheelhouse
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up exact wheelhouse-verification Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.6"

      - name: Download the verified amd64 wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-wheelhouse-${{ github.sha }}-amd64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wheelhouse-amd64
          digest-mismatch: error

      - name: Download the verified arm64 wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-wheelhouse-${{ github.sha }}-arm64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wheelhouse-arm64
          digest-mismatch: error

      - name: Reverify both transported wheelhouses
        run: |
          set -euo pipefail
          for architecture in amd64 arm64; do
            python .github/scripts/native_wheelhouse.py verify \
              --inputs containers/native-wheelhouse/inputs.json \
              --wheelhouse "${RUNNER_TEMP}/wheelhouse-${architecture}" \
              --platform "linux/${architecture}" \
              --work "${RUNNER_TEMP}/transport-verify-${architecture}"
          done

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cache-binary: false
          version: v0.35.0
          driver-opts: >-
            image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f

      - name: Name the temporary candidate tag
        id: candidate
        run: >-
          echo
          "tag=${IMAGE}:candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          >> "$GITHUB_OUTPUT"

      - name: Publish the verified bytes without recompiling
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: containers/native-wheelhouse/Publish.Dockerfile
          build-contexts: |
            wheelhouse-amd64=${{ runner.temp }}/wheelhouse-amd64
            wheelhouse-arm64=${{ runner.temp }}/wheelhouse-arm64
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.candidate.outputs.tag }}
          provenance: mode=max
          sbom: true
          build-args: |
            SOURCE_REVISION=${{ github.sha }}

      - name: Verify the published platform index and extract SBOMs
        id: platforms
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Published wheelhouse digest is invalid"
            exit 1
          fi
          image="${IMAGE}@${DIGEST}"
          raw_manifest="$(docker buildx imagetools inspect "$image" --raw)"
          jq -e '
            [.manifests[]
             | select(
                 .platform.os == "linux"
                 and (
                   .platform.architecture == "amd64"
                   or .platform.architecture == "arm64"
                 )
               )
             | [.platform.os, .platform.architecture]]
            | sort
            | . == [["linux", "amd64"], ["linux", "arm64"]]
          ' <<<"$raw_manifest" >/dev/null

          for architecture in amd64 arm64; do
            platform_digest="$(
              jq -er --arg architecture "$architecture" '
                [.manifests[]
                 | select(
                     .platform.os == "linux"
                     and .platform.architecture == $architecture
                   )]
                | if length == 1
                  then .[0].digest
                  else error("expected exactly one platform manifest")
                  end
              ' <<<"$raw_manifest"
            )"
            echo "${architecture}_digest=${platform_digest}" >> "$GITHUB_OUTPUT"
            docker buildx imagetools inspect "$image" \
              --format "{{ json (index .SBOM \"linux/${architecture}\").SPDX }}" \
              | jq -e 'select(.SPDXID == "SPDXRef-DOCUMENT")' \
              > "native-wheelhouse-sbom-linux-${architecture}.spdx.json"
          done

      - name: Attest wheelhouse provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest amd64 wheelhouse SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.platforms.outputs.amd64_digest }}
          sbom-path: native-wheelhouse-sbom-linux-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest arm64 wheelhouse SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.platforms.outputs.arm64_digest }}
          sbom-path: native-wheelhouse-sbom-linux-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the wheelhouse and SBOM files
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          for sbom in native-wheelhouse-sbom-linux-*.spdx.json; do
            cosign sign-blob --yes --bundle "${sbom}.sigstore.json" "$sbom"
          done

      - name: Upload signed wheelhouse SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-wheelhouse-sboms-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            native-wheelhouse-sbom-linux-*.spdx.json
            native-wheelhouse-sbom-linux-*.spdx.json.sigstore.json
          if-no-files-found: error
          retention-days: 14

      - name: Add verified wheelhouse tags
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          immutable_tag="${IMAGE}:sha-${GITHUB_SHA}"
          for tag in "$immutable_tag" "${IMAGE}:latest"; do
            existing_digest="$(
              docker buildx imagetools inspect "$tag" 2>/dev/null \
                | awk '$1 == "Digest:" { print $2; exit }' \
                || true
            )"
            if [[ "$tag" == "$immutable_tag" \
              && -n "$existing_digest" \
              && "$existing_digest" != "$DIGEST" ]]; then
              echo "::error::Refusing to move existing wheelhouse commit tag"
              exit 1
            fi
            if [[ "$existing_digest" == "$DIGEST" ]]; then
              continue
            fi
            docker buildx imagetools create --tag "$tag" "${IMAGE}@${DIGEST}"
            tagged_digest=""
            for _ in $(seq 1 10); do
              tagged_digest="$(
                docker buildx imagetools inspect "$tag" 2>/dev/null \
                  | awk '$1 == "Digest:" { print $2; exit }' \
                  || true
              )"
              if [[ "$tagged_digest" == "$DIGEST" ]]; then
                break
              fi
              sleep 2
            done
            if [[ "$tagged_digest" != "$DIGEST" ]]; then
              echo "::error::Wheelhouse tag did not resolve to the signed digest"
              exit 1
            fi
          done
          {
            echo "## Published native wheelhouse"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
