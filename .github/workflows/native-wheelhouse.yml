name: Native wheelhouse

on:
  pull_request:
    paths:
      - .dockerignore
      - .github/scripts/native_wheelhouse.py
      - .github/workflows/native-wheelhouse.yml
      - containers/native-wheelhouse/**
      - tests/test_native_wheelhouse.py
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - .github/scripts/native_wheelhouse.py
      - .github/workflows/native-wheelhouse.yml
      - containers/native-wheelhouse/**
      - tests/test_native_wheelhouse.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-wheelhouse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}-native-wheelhouse

jobs:
  build:
    name: Build wheelhouse (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            machine: x86_64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            machine: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Require the native runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          if [ "$actual" != "$EXPECTED_MACHINE" ]; then
            echo "::error::Native wheelhouse runner is $actual, expected $EXPECTED_MACHINE"
            exit 1
          fi

      - name: Set up exact wheelhouse-verification Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cache-binary: false
          version: v0.35.0
          driver-opts: >-
            image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f

      - name: Build two isolated wheel sets
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: containers/native-wheelhouse/Dockerfile
          target: wheelhouse
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=local,dest=${{ runner.temp }}/native-wheelhouse
          provenance: false
          sbom: false
          cache-from: type=gha,scope=native-wheelhouse-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=native-wheelhouse-${{ matrix.architecture }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}

      - name: Verify the exported wheelhouse read-only contract
        env:
          PLATFORM: ${{ matrix.platform }}
        run: >-
          python .github/scripts/native_wheelhouse.py verify
          --inputs containers/native-wheelhouse/inputs.json
          --wheelhouse "$RUNNER_TEMP/native-wheelhouse/wheelhouse"
          --platform "$PLATFORM"
          --work "$RUNNER_TEMP/native-wheelhouse-verify"

      - name: Upload the verified platform wheelhouse
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: >-
            native-wheelhouse-${{ github.sha }}-${{ matrix.architecture }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-wheelhouse/wheelhouse/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    name: Publish verified multi-platform wheelhouse
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up exact wheelhouse-verification Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"

      - name: List producer artifact identities
        id: producer-artifact-inventory
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          result-encoding: string
          script: |
            const artifacts = [];
            const pages = github.paginate.iterator(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              },
            );
            for await (const response of pages) {
              const page = response.data;
              if (!Array.isArray(page)) {
                throw new Error("Artifact API returned an invalid page");
              }
              if (artifacts.length + page.length > 1000) {
                throw new Error("Workflow run has too many artifacts");
              }
              for (const artifact of page) {
                if (
                  artifact === null
                  || typeof artifact !== "object"
                  || Array.isArray(artifact)
                ) {
                  throw new Error("Artifact API returned an invalid artifact");
                }
                artifacts.push(artifact);
              }
            }
            const identities = artifacts.map((artifact) => ({
              digest: artifact.digest,
              expired: artifact.expired,
              id: artifact.id,
              name: artifact.name,
              size_in_bytes: artifact.size_in_bytes,
              workflow_run: {
                head_sha: artifact.workflow_run?.head_sha,
                id: artifact.workflow_run?.id,
              },
            }));
            const encoded = JSON.stringify(identities);
            if (Buffer.byteLength(encoded, "utf8") > 512 * 1024) {
              throw new Error("Producer artifact metadata is too large");
            }
            return encoded;

      - name: Select verified producer artifacts by immutable ID
        id: producer-artifacts
        env:
          NATIVE_WHEELHOUSE_ARTIFACTS: >-
            ${{ steps.producer-artifact-inventory.outputs.result }}
        run: |
          set -euo pipefail
          python .github/scripts/native_wheelhouse.py select-producer-artifacts \
            --source-revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --current-attempt "$GITHUB_RUN_ATTEMPT" \
            >> "$GITHUB_OUTPUT"

      - name: Download the verified amd64 wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.producer-artifacts.outputs.amd64-artifact-id }}
          path: ${{ runner.temp }}/wheelhouse-amd64
          digest-mismatch: error

      - name: Download the verified arm64 wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.producer-artifacts.outputs.arm64-artifact-id }}
          path: ${{ runner.temp }}/wheelhouse-arm64
          digest-mismatch: error

      - name: Reverify both transported wheelhouses
        env:
          AMD64_ARTIFACT_ID: ${{ steps.producer-artifacts.outputs.amd64-artifact-id }}
          AMD64_PRODUCER_ATTEMPT: >-
            ${{ steps.producer-artifacts.outputs.amd64-producer-attempt }}
          ARM64_ARTIFACT_ID: ${{ steps.producer-artifacts.outputs.arm64-artifact-id }}
          ARM64_PRODUCER_ATTEMPT: >-
            ${{ steps.producer-artifacts.outputs.arm64-producer-attempt }}
        run: |
          set -euo pipefail
          for architecture in amd64 arm64; do
            python .github/scripts/native_wheelhouse.py verify \
              --inputs containers/native-wheelhouse/inputs.json \
              --wheelhouse "${RUNNER_TEMP}/wheelhouse-${architecture}" \
              --platform "linux/${architecture}" \
              --work "${RUNNER_TEMP}/transport-verify-${architecture}"
            install --mode=0444 \
              "${RUNNER_TEMP}/wheelhouse-${architecture}/sbom.spdx.json" \
              "native-wheelhouse-sbom-linux-${architecture}.spdx.json"
          done
          {
            echo "## Verified producer artifacts"
            echo
            echo "- amd64: artifact ${AMD64_ARTIFACT_ID}, attempt ${AMD64_PRODUCER_ATTEMPT}"
            echo "- arm64: artifact ${ARM64_ARTIFACT_ID}, attempt ${ARM64_PRODUCER_ATTEMPT}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cache-binary: false
          version: v0.35.0
          driver-opts: >-
            image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f

      - name: Name the temporary candidate tag
        id: candidate
        run: >-
          echo
          "tag=${IMAGE}:candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          >> "$GITHUB_OUTPUT"

      - name: Publish the verified bytes without recompiling
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: containers/native-wheelhouse/Publish.Dockerfile
          build-contexts: |
            wheelhouse-amd64=${{ runner.temp }}/wheelhouse-amd64
            wheelhouse-arm64=${{ runner.temp }}/wheelhouse-arm64
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.candidate.outputs.tag }}
          provenance: mode=max
          sbom: false
          build-args: |
            SOURCE_REVISION=${{ github.sha }}

      - name: Verify the published platform index
        id: platforms
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Published wheelhouse digest is invalid"
            exit 1
          fi
          image="${IMAGE}@${DIGEST}"
          raw_manifest="$(docker buildx imagetools inspect "$image" --raw)"
          jq -e '
            [.manifests[] | [.platform.os, .platform.architecture]]
            | map(select(. != ["unknown", "unknown"]))
            | sort
            | . == [["linux", "amd64"], ["linux", "arm64"]]
          ' <<<"$raw_manifest" >/dev/null

          for architecture in amd64 arm64; do
            platform_digest="$(
              jq -er --arg architecture "$architecture" '
                [.manifests[]
                 | select(
                     .platform.os == "linux"
                     and .platform.architecture == $architecture
                   )]
                | if length == 1
                  then .[0].digest
                  else error("expected exactly one platform manifest")
                  end
              ' <<<"$raw_manifest"
            )"
            echo "${architecture}_digest=${platform_digest}" >> "$GITHUB_OUTPUT"
          done

      - name: Attest wheelhouse provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest amd64 wheelhouse SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.platforms.outputs.amd64_digest }}
          sbom-path: native-wheelhouse-sbom-linux-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest arm64 wheelhouse SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.platforms.outputs.arm64_digest }}
          sbom-path: native-wheelhouse-sbom-linux-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign the wheelhouse and SBOM files
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          for sbom in native-wheelhouse-sbom-linux-*.spdx.json; do
            cosign sign-blob --yes --bundle "${sbom}.sigstore.json" "$sbom"
          done

      - name: Upload signed wheelhouse SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-wheelhouse-sboms-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            native-wheelhouse-sbom-linux-*.spdx.json
            native-wheelhouse-sbom-linux-*.spdx.json.sigstore.json
          if-no-files-found: error
          retention-days: 14

      - name: Add verified wheelhouse tags
        env:
          CANDIDATE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          immutable_tag="${IMAGE}:sha-${GITHUB_SHA}"
          selected_digest="$CANDIDATE_DIGEST"
          existing_commit_digest="$(
            docker buildx imagetools inspect "$immutable_tag" 2>/dev/null \
              | awk '$1 == "Digest:" { print $2; exit }' \
              || true
          )"
          if [[ -n "$existing_commit_digest" \
            && ! "$existing_commit_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Existing wheelhouse commit tag has an invalid digest"
            exit 1
          fi

          if [[ -n "$existing_commit_digest" \
            && "$existing_commit_digest" != "$CANDIDATE_DIGEST" ]]; then
            cosign verify \
              --certificate-identity \
                "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/native-wheelhouse.yml@refs/heads/main" \
              --certificate-oidc-issuer \
                "https://token.actions.githubusercontent.com" \
              "${IMAGE}@${existing_commit_digest}"

            raw_manifest="$(
              docker buildx imagetools inspect \
                "${IMAGE}@${existing_commit_digest}" \
                --raw
            )"
            jq -e '
              [.manifests[] | [.platform.os, .platform.architecture]]
              | map(select(. != ["unknown", "unknown"]))
              | sort
              | . == [["linux", "amd64"], ["linux", "arm64"]]
            ' <<<"$raw_manifest" >/dev/null

            for architecture in amd64 arm64; do
              existing_directory="$(
                printf '%s/existing-wheelhouse-%s' \
                  "$RUNNER_TEMP" \
                  "$architecture"
              )"
              mkdir --mode=0700 "$existing_directory"
              (
                container_id=""
                # Invoked by the EXIT trap.
                # shellcheck disable=SC2317,SC2329
                cleanup() {
                  if [[ -n "$container_id" ]]; then
                    docker rm --force "$container_id" >/dev/null 2>&1 || true
                  fi
                }
                trap cleanup EXIT
                docker pull --quiet \
                  --platform "linux/${architecture}" \
                  "${IMAGE}@${existing_commit_digest}"
                container_id="$(
                  docker create \
                    --platform "linux/${architecture}" \
                    "${IMAGE}@${existing_commit_digest}" \
                    /wheelhouse-not-executed
                )"
                revision="$(
                  docker inspect \
                    --format \
                      '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
                    "$container_id"
                )"
                if [[ "$revision" != "$GITHUB_SHA" ]]; then
                  echo "::error::Existing wheelhouse revision label is invalid"
                  exit 1
                fi
                docker cp \
                  "${container_id}:/wheelhouse/." \
                  "$existing_directory"
              )
              python .github/scripts/native_wheelhouse.py verify \
                --inputs containers/native-wheelhouse/inputs.json \
                --wheelhouse "$existing_directory" \
                --platform "linux/${architecture}" \
                --work "${RUNNER_TEMP}/existing-verify-${architecture}"
              if ! diff \
                --brief \
                --no-dereference \
                --recursive \
                "${RUNNER_TEMP}/wheelhouse-${architecture}" \
                "$existing_directory"; then
                echo "::error::Existing wheelhouse payload differs from this run"
                exit 1
              fi
            done
            selected_digest="$existing_commit_digest"
          fi

          tag_and_wait() {
            local tag="$1"
            local digest="$2"
            local may_move="$3"
            local resolved_digest=""
            resolved_digest="$(
              docker buildx imagetools inspect "$tag" 2>/dev/null \
                | awk '$1 == "Digest:" { print $2; exit }' \
                || true
            )"
            if [[ "$resolved_digest" == "$digest" ]]; then
              return
            fi
            if [[ -n "$resolved_digest" && "$may_move" != "true" ]]; then
              echo "::error::Refusing to move existing wheelhouse commit tag"
              exit 1
            fi
            docker buildx imagetools create --tag "$tag" "${IMAGE}@${digest}"
            for _ in $(seq 1 10); do
              resolved_digest="$(
                docker buildx imagetools inspect "$tag" 2>/dev/null \
                  | awk '$1 == "Digest:" { print $2; exit }' \
                  || true
              )"
              if [[ "$resolved_digest" == "$digest" ]]; then
                break
              fi
              sleep 2
            done
            if [[ "$resolved_digest" != "$digest" ]]; then
              echo "::error::Wheelhouse tag did not resolve to the signed digest"
              exit 1
            fi
          }

          tag_and_wait "$immutable_tag" "$selected_digest" false
          tag_and_wait "${IMAGE}:latest" "$selected_digest" true
          {
            echo "## Published native wheelhouse"
            echo
            echo "\`${IMAGE}@${selected_digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
