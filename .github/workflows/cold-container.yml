name: Cold container build

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cold-container
  cancel-in-progress: false

jobs:
  container:
    name: Cold container (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            machine: x86_64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            machine: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Require native runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "${EXPECTED_MACHINE}"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          buildkitd-flags: --debug
          driver-opts: >-
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          version: v0.36.1 # buildx runtime

      - name: Build without caches
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          no-cache: true
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
          sbom: false
          tags: extra-codeowners:cold-${{ matrix.architecture }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            VERSION=0.0.0+git.${{ github.sha }}

      - name: Smoke test cold image
        run: >-
          .github/scripts/smoke-container.sh
          extra-codeowners:cold-${{ matrix.architecture }}
          ${{ matrix.architecture }}
          extra-codeowners-cold-smoke-${{ matrix.architecture }}
          0.0.0+git.${{ github.sha }}
          0.0.0+git.${{ github.sha }}
          ${{ github.sha }}
