name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

env:
  UV_FROZEN: "true"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@6ee6290f1cbc4156c0bdd66691b2c144ef8df19a # v7.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lockfile is current
        env:
          UV_FROZEN: "false"
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --all-groups --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint Python
        run: uv run ruff check .

      - name: Type check
        run: >-
          uv run mypy extra_codeowners tests tools/evaluation_beta.py
          tools/evaluation_beta_bootstrap.py tools/readthedocs_bootstrap.py
          tools/release_inventory.py .github/scripts/release_plan.py

      - name: Lint YAML
        run: uv run yamllint .

      - name: Lint shell scripts
        run: |
          docker run --rm --volume "${PWD}:/mnt:ro" \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            .github/scripts/smoke-container.sh \
            .github/scripts/test-helm-chart.sh \
            .github/scripts/test-postgres-backup-restore.sh \
            .github/scripts/verify-release-provenance.sh

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            coverage: true
            postgres: true
            test-postgres-url: >-
              postgresql+psycopg://extra_codeowners:extra_codeowners@127.0.0.1:5432/extra_codeowners_test
          - python-version: "3.13"
            coverage: false
            postgres: false
            test-postgres-url: ""
          - python-version: "3.14"
            coverage: false
            postgres: false
            test-postgres-url: ""
    services:
      postgres:
        image: >- # zizmor: ignore[unpinned-images] Empty matrix branches disable this service.
          ${{ matrix.postgres &&
          'postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2'
          || '' }}
        env:
          POSTGRES_DB: extra_codeowners_test
          POSTGRES_PASSWORD: extra_codeowners
          POSTGRES_USER: extra_codeowners
        options: >-
          --health-cmd "pg_isready --username=extra_codeowners --dbname=extra_codeowners_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@6ee6290f1cbc4156c0bdd66691b2c144ef8df19a # v7.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --all-groups --frozen --python "${{ matrix.python-version }}"

      - name: Run tests with branch coverage
        if: matrix.coverage
        env:
          TEST_POSTGRES_URL: ${{ matrix.test-postgres-url }}
        run: >-
          uv run --python "${{ matrix.python-version }}" pytest
          --cov=extra_codeowners --cov-branch --cov-report=term-missing
          --cov-report=xml --cov-report=html --cov-fail-under=85

      - name: Run Python compatibility tests
        if: ${{ !matrix.coverage }}
        run: uv run --python "${{ matrix.python-version }}" pytest --no-cov

      - name: Migrate PostgreSQL test database
        if: matrix.postgres
        env:
          EXTRA_CODEOWNERS_DATABASE_URL: ${{ matrix.test-postgres-url }}
          EXTRA_CODEOWNERS_ENVIRONMENT: production
        run: uv run python -m extra_codeowners database migrate

      - name: Verify PostgreSQL backup and restore
        if: matrix.postgres
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: extra_codeowners
          PGPORT: "5432"
          PGUSER: extra_codeowners
          RESTORE_DATABASE: extra_codeowners_restore_test
          SOURCE_DATABASE: extra_codeowners_test
        run: >-
          .github/scripts/test-postgres-backup-restore.sh
          'postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2'

      - name: Upload coverage report
        if: matrix.coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-3.12
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  package:
    name: Python package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@6ee6290f1cbc4156c0bdd66691b2c144ef8df19a # v7.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked build backend
        run: uv sync --frozen --only-group build --no-install-project --no-build

      - name: Build wheel and source distribution
        run: uv build --python .venv/bin/python --no-build-isolation --out-dir dist

      - name: Verify wheel metadata and clean installation
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          sdist="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "${wheel}" && test -n "${sdist}"
          uv venv "${RUNNER_TEMP}/wheel-check"
          uv pip install --python "${RUNNER_TEMP}/wheel-check/bin/python" \
            --offline --no-index --no-deps "${wheel}"
          "${RUNNER_TEMP}/wheel-check/bin/python" -c \
            'import extra_codeowners, importlib.metadata; assert importlib.metadata.version("extra-codeowners")'

      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  docs:
    name: Documentation and Markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@6ee6290f1cbc4156c0bdd66691b2c144ef8df19a # v7.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install documentation dependencies
        run: uv sync --frozen --only-group docs

      - name: Build documentation in strict mode
        run: uv run mkdocs build --strict

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            #site/**
            #.venv/**

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0 # helm runtime

      - name: Test chart
        run: .github/scripts/test-helm-chart.sh "${RUNNER_TEMP}/helm"

      - name: Validate rendered Kubernetes resources
        run: >-
          docker run --rm
          --volume "${RUNNER_TEMP}/helm:/work:ro"
          ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          -kubernetes-version 1.27.0 -strict -summary
          -skip ServiceMonitor,PrometheusRule
          /work/default.yaml /work/optional.yaml /work/credentials.yaml
          /work/rolling-update.yaml

  container:
    name: Container (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            machine: x86_64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: arm64
            machine: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Require native runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "${EXPECTED_MACHINE}"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          buildkitd-flags: --debug
          driver-opts: >-
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          version: v0.36.1 # buildx runtime

      - name: Build native container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
          sbom: false
          tags: extra-codeowners:ci-${{ matrix.architecture }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            VERSION=0.0.0+git.${{ github.sha }}
          cache-from: type=gha,scope=container-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.architecture }},ignore-error=true,timeout=5m

      - name: Smoke test hardened container
        run: >-
          .github/scripts/smoke-container.sh
          extra-codeowners:ci-${{ matrix.architecture }}
          ${{ matrix.architecture }}
          extra-codeowners-ci-smoke-${{ matrix.architecture }}
          0.0.0+git.${{ github.sha }}
          0.0.0+git.${{ github.sha }}
          ${{ github.sha }}

      - name: Inventory high-severity vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          by-cve: true
          config: .grype.yaml
          image: extra-codeowners:ci-${{ matrix.architecture }}
          fail-build: false
          only-fixed: false
          output-file: vulnerability-report-${{ matrix.architecture }}.json
          output-format: json
          severity-cutoff: high

      - name: Upload vulnerability inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerability-report-${{ matrix.architecture }}-${{ github.sha }}
          path: vulnerability-report-${{ matrix.architecture }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Reject fixable high-severity vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          by-cve: true
          config: .grype.yaml
          image: extra-codeowners:ci-${{ matrix.architecture }}
          fail-build: true
          only-fixed: true
          output-format: table
          severity-cutoff: high

  required:
    name: Required
    if: ${{ always() }}
    needs:
      - lint
      - test
      - package
      - docs
      - helm
      - container
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every CI job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            test "${result}" = success
          done

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: required
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/release.yml
